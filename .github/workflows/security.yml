name: Checks and secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install PHP extensions and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-gd php-mbstring poppler-utils
      - name: Run offline checks
        run: bash scripts/check.sh
      - name: Scan Git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 -O "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${checksums}"
          grep " ${archive}$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner
