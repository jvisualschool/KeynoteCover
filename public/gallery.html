<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f5f1">
  <script src="assets/appearance.js?v=20261027-public"></script>
  <title>KEYCOVER · 표지 갤러리</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=20261027-public">
  <link rel="stylesheet" href="assets/appearance.css?v=20261027-public">
  <script src="assets/common.js?v=20261027-public" defer></script>
  <script src="assets/gallery.js?v=20261027-public" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="KEYCOVER 처음으로"><img src="assets/icon.svg" alt="" width="34" height="34">KEYCOVER<span>for Keynote</span></a>
    <nav class="page-nav" aria-label="주 메뉴"><a href="./">생성</a><a href="gallery.html" aria-current="page">표지 갤러리</a></nav>
    <div class="header-actions">
      <button id="appearance-toggle" class="appearance-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
        <svg class="appearance-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6Z"/></svg>
        <svg class="appearance-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main id="app-main" class="gallery-main">
    <div class="gallery-heading"><h1>표지 갤러리 <span id="gallery-count"></span></h1><a class="primary" href="./?new=1">새 표지 만들기 <span aria-hidden="true">＋</span></a></div>
    <form id="gallery-search" class="gallery-search" role="search">
      <label class="sr-only" for="search-input">제목·파일명·키워드·프롬프트 검색</label>
      <input id="search-input" type="search" maxlength="120" placeholder="제목 · 파일명 · 키워드 · 프롬프트 검색">
      <button type="submit" class="primary">검색</button><button id="clear-search" type="button" class="text-button">초기화</button>
    </form>
    <div id="gallery-error" class="notice error" role="alert" hidden><p id="gallery-error-message"></p><button id="retry-gallery" type="button" class="text-button">다시 시도</button></div>
    <p id="gallery-status" class="gallery-status" role="status" aria-live="polite"></p>
    <div id="delete-notice" class="delete-notice" role="status" hidden><span>갤러리에서 숨겼습니다.</span><button id="undo-delete" class="text-button" type="button">되돌리기</button></div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <div id="gallery-empty" class="gallery-empty" hidden><p id="empty-message">아직 생성한 표지가 없습니다.</p><a class="text-button" href="./?new=1">표지 만들기 ↗</a></div>
    <nav id="gallery-pagination" class="gallery-pagination" aria-label="갤러리 페이지" hidden><button id="previous-page" class="secondary" type="button">← 이전</button><span id="page-number"></span><button id="next-page" class="secondary" type="button">다음 →</button></nav>
    <dialog id="cover-dialog" class="cover-dialog" aria-labelledby="detail-title">
      <div class="detail-heading"><h2 id="detail-title">표지 상세정보</h2><button id="close-detail" type="button" class="close-button" aria-label="상세정보 닫기">×</button></div>
      <img id="detail-image" class="detail-image" alt="">
      <div class="detail-body">
        <div class="detail-actions"><button id="detail-download" class="download-button" type="button">PNG 다운로드 ↓</button><button id="detail-delete" class="delete-button" type="button" hidden>공개 취소</button><a id="resume-job" class="text-button" href="./" hidden>다른 버전 만들기 ↗</a></div>
        <p id="detail-error" class="detail-error" role="alert" hidden></p>
        <dl id="detail-meta" class="detail-meta"></dl>
        <div id="detail-keywords" class="keywords"></div>
        <section class="detail-section"><h3>강의 내용</h3><p id="detail-summary"></p></section>
        <section class="detail-section"><h3>장면 구성</h3><p id="detail-direction"></p></section>
        <section class="detail-section"><div class="prompt-heading"><h3 id="prompt-title">생성 프롬프트</h3><button id="copy-prompt" class="text-button" type="button">프롬프트 복사</button></div><textarea id="detail-prompt" readonly aria-labelledby="prompt-title" rows="10" spellcheck="false"></textarea><p id="copy-status" class="copy-status" role="status"></p></section>
      </div>
    </dialog>
    <footer><span>KEYCOVER</span><span>2560 × 1440 PNG</span></footer>
  </main>
</body>
</html>
